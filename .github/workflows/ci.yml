name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raisely
          POSTGRES_PASSWORD: raisely
          POSTGRES_DB: raisely
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raisely"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://raisely:raisely@localhost:5432/raisely?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @raisely/shared-types build

      - name: Generate Prisma clients
        run: |
          pnpm --filter @raisely/api prisma:generate
          pnpm --filter @raisely/web prisma:generate

      - name: Create test database
        run: |
          PGPASSWORD=raisely psql -h localhost -U raisely -d raisely -c "CREATE DATABASE raisely_test;"

      - name: Run migrations (dev + test databases)
        run: |
          pnpm --filter @raisely/api prisma:deploy
          DATABASE_URL=postgresql://raisely:raisely@localhost:5432/raisely_test?schema=public pnpm --filter @raisely/api prisma:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
